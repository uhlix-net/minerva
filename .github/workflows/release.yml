name: release
# On a version tag (v0.1.0): build and push the image to Docker Hub (docker.io/uhlix/minerva), package the Helm chart and attach it
# to a GitHub release. On pushes to main: build only (no push).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: azure/setup-helm@v4
      - run: helm lint charts/minerva --set baseUrl=https://minerva.example.com
      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with: {username: uhlix, password: "${{ secrets.DOCKERHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            docker.io/uhlix/minerva:${{ steps.v.outputs.version }}
            docker.io/uhlix/minerva:latest
      - name: Package chart and release
        if: startsWith(github.ref, 'refs/tags/v')
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          v=${{ steps.v.outputs.version }}
          sed -i "s/^version:.*/version: $v/; s/^appVersion:.*/appVersion: \"$v\"/" charts/minerva/Chart.yaml
          helm package charts/minerva -d dist-chart
          gh release upload "v$v" dist-chart/minerva-$v.tgz --clobber 2>/dev/null \
            || gh release create "v$v" dist-chart/minerva-$v.tgz --title "Minerva $v" --generate-notes

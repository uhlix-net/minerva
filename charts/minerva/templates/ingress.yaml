{{- if .Values.ingress.enabled }}
{{- $hosts := prepend .Values.ingress.hosts (include "minerva.host" .) | uniq }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "minerva.fullname" . }}
  labels: {{- include "minerva.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls.secretName }}
  tls:
    - secretName: {{ . }}
      hosts: {{- toYaml $hosts | nindent 8 }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "minerva.fullname" $ }}
                port: {name: http}
    {{- end }}
{{- end }}

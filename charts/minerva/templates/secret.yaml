{{- $name := include "minerva.secret" . -}}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "minerva.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  session-secret: {{ .Values.sessionSecret | b64enc | default (get $old "session-secret") | default (randAlphaNum 48 | b64enc) }}
  db-password: {{ get $old "db-password" | default (randAlphaNum 32 | b64enc) }}
  {{- if not .Values.admin.existingSecret }}
  admin-username: {{ .Values.admin.username | b64enc }}
  admin-password: {{ .Values.admin.password | b64enc }}
  {{- end }}

{{- if .Values.preflight.enabled }}
# Runs before every install/upgrade: DNS for the host, the TLS certificate (host match, expiry),
# OIDC discovery and LDAP bind. A failed check fails the Helm release before anything changes.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "minerva.fullname" . }}-preflight
  labels: {{- include "minerva.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels: {{- include "minerva.selector" . | nindent 8 }}
        app.kubernetes.io/component: preflight
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: preflight
          image: {{ include "minerva.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [node, server/dist/preflight.js]
          env:
            {{- include "minerva.commonEnv" . | nindent 12 }}
            - name: MINERVA_SKIP_CHECKS
              value: session-secret   # generated by the chart after this hook runs
            {{- if .Values.ingress.tls.secretName }}
            - name: MINERVA_TLS_CERT_FILE
              value: /etc/minerva-tls/tls.crt
            {{- end }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- include "minerva.caMount" . | nindent 12 }}
            {{- if .Values.ingress.tls.secretName }}
            - {name: tls, mountPath: /etc/minerva-tls, readOnly: true}
            {{- end }}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        {{- include "minerva.caVolume" . | nindent 8 }}
        {{- if .Values.ingress.tls.secretName }}
        - name: tls
          secret: {secretName: {{ .Values.ingress.tls.secretName }}, items: [{key: tls.crt, path: tls.crt}]}
        {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
